<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Monitor Eleitoral{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
  header { margin-bottom: 2rem; border-bottom: 1px solid currentColor; padding-bottom: 1rem; }
  header a { text-decoration: none; font-weight: 700; font-size: 1.1rem; }
  .aviso { font-size: 0.85rem; opacity: 0.75; margin-top: 0.5rem; }
  .candidato-lista { border: 1px solid currentColor; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  .candidato-lista a { font-weight: 600; font-size: 1.05rem; text-decoration: none; }
  .meta { font-size: 0.9rem; opacity: 0.8; }
  .tema { margin: 2rem 0; }
  .tema h2 { font-size: 1.1rem; border-bottom: 1px solid currentColor; padding-bottom: 0.3rem; }
  .citacao { border-left: 3px solid currentColor; padding-left: 1rem; margin-bottom: 1rem; opacity: 0.95; }
  .citacao .fonte { font-size: 0.8rem; opacity: 0.7; }
  .plano { margin: 1.5rem 0; padding: 1rem; border: 1px solid currentColor; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <a href="/">Monitor Eleitoral</a>
  <div class="aviso">
    Este site apresenta evidência lado a lado — o que cada candidato registrou
    no plano de governo e o que disse publicamente. Não há nota, ranking ou
    recomendação de voto.
  </div>
</header>
{% block conteudo %}{% endblock %}
</body>
</html>
