# Blueprint do Render (https://render.com/docs/blueprint-spec) pro site
# publico. So' isso vai pro deploy — nada de coleta, transcricao ou
# revisao roda aqui, so' leitura de dados_publicos/ (ver
# scripts/exportar_dados_publicos.py).
services:
  - type: web
    name: monitor-eleitoral
    runtime: python
    plan: free
    pythonVersion: "3.13.11"
    buildCommand: "pip install -r requirements-publico.txt"
    startCommand: >-
      cd src && python3 -m transcricao.site_publico
      --candidatos ../dados_publicos/candidatos
      --dados ../dados_publicos/transcricoes
      --planos ../dados_publicos/planos_de_governo
      --planos-curados ../dados_publicos/planos_curados
      --host 0.0.0.0
      --porta $PORT
